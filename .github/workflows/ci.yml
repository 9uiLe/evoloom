name: Verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EVOLOOM_XCODE_DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install fixed Nix version
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11
      - name: Check exact Nix and Apple environment
        run: |
          nix --version
          nix develop -c just doctor
      - name: Prepare locked Swift dependencies
        run: nix develop -c just prepare-deps
      - name: Verify source, copy install, iOS tests and pixels
        run: nix develop -c just check
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-test-evidence
          path: |
            TestResults/
            Testing/Tests/EvoloomSnapshotTests/__Snapshots__/
